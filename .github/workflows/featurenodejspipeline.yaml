name: nodejs-feature-actions

on: workflow_dispatch

permissions:
  security-events: read

jobs:
  catalogue-dev-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # required for SonarQube to correctly assess new code / blame info

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: install dependencies
        run: npm install

      - name: unit-tests
        run: npm test

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}

      - name: SonarQube Quality Gate check
        id: sonarqube-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          pollingTimeoutSec: 600
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_URL }}

      - name: Check Dependabot Alerts
        uses: Posture-Cybersecurity/dependabot-security-checker@v1.1.5
        with:
          github-token: ${{ secrets.DEPENDABOT_TOKEN }}
          severities: 'critical,high'  # Only check critical and high
          output-file: 'security-report.csv'
          fail-on-alerts: 'true'  # Fail workflow if alerts found 
